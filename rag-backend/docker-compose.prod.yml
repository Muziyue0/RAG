services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_backend_service
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?API_AUTH_TOKEN must be set in .env}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - hf_cache:/workspace/hf_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --save 60 1
    restart: unless-stopped
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  hf_cache:
  redis_data:
